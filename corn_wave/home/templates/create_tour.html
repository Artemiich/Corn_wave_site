<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Создание нового тура</title>
</head>
<body>
    <header>
        <h1>Создать новый тур</h1>
    </header>
    <main>
        <form method="POST">
            {% csrf_token %}
            <label for="name">Название тура:</label>
            <input type="text" id="name" name="name" required>
            <br>
            <label for="date">Дата тура:</label>
            <input type="date" id="date" name="date" required>
            <br>
            <button type="submit">Создать</button>
        </form>
        <a href="{% url 'tour' %}">Назад к списку туров</a>
    </main>
</body>
</html>
