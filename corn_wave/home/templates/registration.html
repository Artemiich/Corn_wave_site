<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>Registration</title>
    <style>
        @import url('https://fonts.googleapis.com/css?family=Montserrat:400,500&display=swap');

        body {
            font-family: 'Montserrat', Arial, Helvetica, sans-serif;
            background-color: #556b2f; /* Dark Olive Green */
            margin: 0;
            padding: 0;
        }

        * {
            box-sizing: border-box;
        }

        .container {
            padding: 20px;
            width: 500px;
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            border: 1px solid #ccc;
            border-radius: 10px;
            background: #a9a9a9; /* Dark Grey */
            box-shadow: 0px 4px 10px rgba(0, 0, 0, 0.2);
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #444;
            text-align: center;
        }

        input[type=text],
        input[type=email],
        input[type=password],
        input[type=file],
        textarea,
        select {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            background: #f7f7f7;
            font-family: inherit;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #0eb7f4;
            outline: none;
        }

        button {
            background-color: #0eb7f4;
            color: white;
            padding: 14px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 100%;
            font-size: 16px;
            font-family: inherit;
            margin-top: 10px;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: #0aa1d2;
        }

        a {
            color: #0eb7f4;
            text-decoration: none;
        }

        a:hover {
            text-decoration: underline;
        }

        small {
            color: red;
            font-size: 12px;
        }
    </style>
</head>

<body>
<form method="POST" enctype="multipart/form-data" action="">
    {% csrf_token %}
    <div class="container">
        <h1>Sign Up</h1>
        <p>Пожалуйста, заполните эту форму, чтобы создать учетную запись.</p>

        {% for field in form %}
        <div>
            <label for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
            <small>{{ error }}</small>
            {% endfor %}
        </div>
        {% endfor %}

        <p>Have an account? / У вас есть аккаунт?
            <a href="{% url 'login' %}">Log in / Войти</a>
        </p>
        <div class="clearfix">
            <button type="submit" class="btn">Зарегистрироваться</button>
        </div>
    </div>
</form>
</body>

</html>
